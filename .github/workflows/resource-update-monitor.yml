name: Official scientific resource update monitor

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-only-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect allowlisted official metadata only
        working-directory: flyash-phreeqc-ml
        run: |
          python3 scripts/monitor_official_resources.py \
            --output /tmp/official-resource-update-report.json
      - name: Retain report for manual review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-resource-update-report-${{ github.run_id }}
          path: /tmp/official-resource-update-report.json
          if-no-files-found: error
          retention-days: 30
