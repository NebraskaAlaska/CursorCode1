name: wpi-virtual-lab-server

services:
  app:
    image: ${WPI_IMAGE:-wpi-virtual-lab:phase4-rc}
    build:
      context: .
      target: release
      args:
        APP_VERSION: ${WPI_APP_VERSION:-0.1.0-phase4-rc}
        VCS_REF: ${WPI_VCS_REF:-uncommitted}
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8501"
    environment:
      VLAB_DEPLOYMENT_MODE: hosted
      VLAB_IMPORT_ROOT: /app/imports
      WPI_AUTH_ENFORCED: "true"
      VLAB_ALLOWED_SUBJECTS: ${VLAB_ALLOWED_SUBJECTS:-}
      VLAB_ALLOWED_TENANTS: ${VLAB_ALLOWED_TENANTS:-}
      VLAB_ADMIN_SUBJECTS: ${VLAB_ADMIN_SUBJECTS:-}
      VLAB_MEMBER_SUBJECTS: ${VLAB_MEMBER_SUBJECTS:-}
      VLAB_MEMBER_TENANTS: ${VLAB_MEMBER_TENANTS:-}
      VLAB_VIEWER_SUBJECTS: ${VLAB_VIEWER_SUBJECTS:-}
      VLAB_VIEWER_TENANTS: ${VLAB_VIEWER_TENANTS:-}
      VLAB_OIDC_TENANT_CLAIM: ${VLAB_OIDC_TENANT_CLAIM:-sub}
      VLAB_AI_PROVIDER: ${VLAB_AI_PROVIDER:-disabled}
      VLAB_AI_MODEL: ${VLAB_AI_MODEL:-}
      VLAB_AI_BASE_URL: ${VLAB_AI_BASE_URL:-}
      VLAB_AI_LOCATION: ${VLAB_AI_LOCATION:-disabled}
      VLAB_AI_ALLOWED_HOSTS: ${VLAB_AI_ALLOWED_HOSTS:-}
      VLAB_AI_ADMIN_MANAGED: "true"
      VLAB_AI_API_KEY: ${VLAB_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${VLAB_AI_API_KEY:-}
      WPI_RESOURCE_ROOT: /var/lib/wpi/resources
      PHREEQC_TIMEOUT_S: ${PHREEQC_TIMEOUT_S:-120}
      PHREEQC_CONTAINER_IMAGE_DIGEST: ${WPI_IMAGE_DIGEST:-}
    volumes:
      - wpi_outputs:/app/outputs
      - wpi_experiments:/app/experiments
      - wpi_processed:/app/data/processed
      - wpi_imports:/app/imports
      - wpi_resources:/var/lib/wpi/resources
      - ${VLAB_STREAMLIT_SECRETS_FILE:?Set VLAB_STREAMLIT_SECRETS_FILE to the reviewed OIDC secrets TOML}:/app/.streamlit/secrets.toml:ro
    networks:
      - backend
      - egress
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: ${WPI_APP_CPUS:-2.0}
    mem_limit: ${WPI_APP_MEMORY:-4g}
    mem_reservation: ${WPI_APP_MEMORY_RESERVATION:-1g}
    pids_limit: ${WPI_APP_PIDS:-256}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      nproc: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  proxy:
    image: ${WPI_PROXY_IMAGE:-nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591}
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700,size=32m
      - /var/run:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700,size=8m
      - /tmp:rw,noexec,nosuid,nodev,uid=101,gid=101,mode=0700,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${WPI_BIND_ADDRESS:-0.0.0.0}:${WPI_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${WPI_AUTH_FILE:?Set WPI_AUTH_FILE to a reviewed htpasswd file}:/etc/nginx/auth.htpasswd:ro
      - ${WPI_TLS_CERT_FILE:?Set WPI_TLS_CERT_FILE to the TLS certificate}:/etc/nginx/tls/server.crt:ro
      - ${WPI_TLS_KEY_FILE:?Set WPI_TLS_KEY_FILE to the TLS private key}:/etc/nginx/tls/server.key:ro
    networks:
      - edge
      - backend
    restart: unless-stopped
    cpus: ${WPI_PROXY_CPUS:-0.5}
    mem_limit: ${WPI_PROXY_MEMORY:-256m}
    pids_limit: 64
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 5s
      retries: 3

  ollama:
    profiles: [private-ai]
    image: ${WPI_OLLAMA_IMAGE:-ollama/ollama:0.11.10@sha256:a5409cb903d30f9cd67e9f430dd336ddc9274e16fd78f75b675c42065991b4fd}
    expose:
      - "11434"
    volumes:
      - wpi_ollama:/root/.ollama
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    cpus: ${WPI_OLLAMA_CPUS:-4.0}
    mem_limit: ${WPI_OLLAMA_MEMORY:-8g}
    pids_limit: 256

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  wpi_outputs:
  wpi_experiments:
  wpi_processed:
  wpi_imports:
  wpi_resources:
  wpi_ollama:
