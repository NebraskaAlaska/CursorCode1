[project]
slug = "wpi-virtual-lab"
allowed_repository = "https://github.com/NebraskaAlaska/CursorCode1.git"
public_repository = true
role_sequence = ["planner", "coder", "tester", "reviewer"]

[git]
allowed_base_branches = ["codex/virtual-lab-finalization-personal"]
task_branch_prefix = "council/wpi/"
forbidden_branches = ["main", "master", "codex/virtual-lab-finalization-personal"]

[tests]
default_commands = [
  ["python3", "-m", "compileall", "-q", "app.py", "app_ui.py", "flyash_phreeqc_ml", "scripts", "ui", "tests"],
  ["python3", "-m", "pytest", "-q", "-p", "no:cacheprovider"],
]
allowed_command_prefixes = [
  ["python3", "-m", "compileall"],
  ["python3", "-m", "pytest"],
  ["python", "-m", "compileall"],
  ["python", "-m", "pytest"],
]

[limits]
max_correction_rounds = 2
max_task_duration_seconds = 28800
max_patch_bytes = 1048576
max_changed_files = 24
max_role_invocations = 16
max_log_bytes = 1048576
lease_seconds = 900
allow_policy_expiry_takeover = false

[security]
scientific_risk_floor = "moderate"
forbidden_paths = [
  ".git/**",
  ".github/workflows/**",
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "data/raw/**",
  "experiments/**/data/**",
  "experiments/**/outputs/**",
  "outputs/**",
  "models/**",
  "databases/**",
  "resources/installed/**",
  "resources/downloads/**",
  "resources/candidates/**",
  "resources/active/**",
  "config/council_operator_policy.toml",
]

[approvals]
required = [
  "task_branch",
  "pull_request",
  "merge",
  "deployment",
  "resource_promotion",
  "resource_rollback",
]

[resource_steward]
automatic_actions = [
  "check",
  "show",
  "download-candidate",
  "verify-candidate",
  "build-candidate",
  "test-candidate",
  "compare",
  "export-report",
]
human_actions = ["promote", "rollback"]

[obsidian]
handoff_note = "WPI Project/99 - Handoff Log.md"

