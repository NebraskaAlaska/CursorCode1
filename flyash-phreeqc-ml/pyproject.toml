[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flyash-phreeqc-ml"
version = "0.1.0"
description = "AI-assisted materials research with deterministic PHREEQC workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.5",
    "numpy==2.5.2",
    "matplotlib==3.11.1",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "streamlit==1.62.0",
    "anthropic==1.2.0",
    "scikit-learn==1.9.0",
    "scipy==1.18.1",
    "joblib==1.5.3",
]

[project.scripts]
wpi-council = "flyash_phreeqc_ml.council_operator.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["flyash_phreeqc_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: heavy/long-running test, excluded from the default run (use -m slow to include)",
    "release: release, container, Compose, or distribution contract",
]
